# CI/CD do HelpDesk Cloud na AWS (AWS Academy), com alta disponibilidade:
#   testes e build → atualiza o servidor de dados → atualiza app-a → confere → atualiza app-b → confere → testa pelo ALB.
# Os servidores de aplicação são atualizados UM DE CADA VEZ (rolling update): enquanto um reinicia,
# o load balancer manda o tráfego para o outro, e a aplicação não sai do ar durante o deploy.
# Os servidores só estão ligados com o AWS Academy Learner Lab ativo (Start Lab).
name: CI/CD — HelpDesk Cloud na AWS

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  testes:
    name: 🧪 Testes e build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servico: [ticket-service, notification-service, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/${{ matrix.servico }}/package-lock.json
      - run: npm ci
        working-directory: app/${{ matrix.servico }}
      - name: Testes automatizados
        if: matrix.servico != 'frontend'
        run: npm test
        working-directory: app/${{ matrix.servico }}
      - name: Build de produção
        if: matrix.servico == 'frontend'
        run: npm run build
        working-directory: app/${{ matrix.servico }}

  imagens:
    name: 🐳 Build das imagens Docker
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v6
      - name: Construir as imagens
        run: docker compose build

  deploy:
    name: 🚀 Deploy gradual na AWS
    runs-on: ubuntu-latest
    needs: imagens
    if: github.event_name != 'pull_request'
    environment: aws-academy
    env:
      DADOS: ${{ secrets.AWS_HOST_DADOS }}
      APP_A: ${{ secrets.AWS_HOST_APP_A }}
      APP_B: ${{ secrets.AWS_HOST_APP_B }}
      ALB: ${{ secrets.AWS_ALB_DNS }}
    steps:
      - name: Conferir os segredos
        env:
          CHAVE: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          faltando=""
          # AWS_HOST_APP_B é opcional: sem ele, a infraestrutura tem um servidor só (servidores_app = 1).
          for nome in DADOS APP_A ALB CHAVE; do
            [ -z "${!nome}" ] && faltando="$faltando $nome"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Faltam segredos:$faltando. Cadastre AWS_HOST_DADOS, AWS_HOST_APP_A, AWS_ALB_DNS e AWS_EC2_SSH_KEY (e AWS_HOST_APP_B se houver dois servidores) (veja docs/AWS-ACADEMY.md)."
            exit 1
          fi

      - name: Preparar a chave SSH
        env:
          CHAVE: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/aws.pem
          chmod 600 ~/.ssh/aws.pem
          cat > ~/.ssh/config <<'CFG'
          Host *
            User ec2-user
            IdentityFile ~/.ssh/aws.pem
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          CFG
          for host in "$DADOS" "$APP_A" ${APP_B:+"$APP_B"}; do
            if ! ssh "$host" true; then
              echo "::error::Não consegui conectar a $host. O laboratório está ligado? Clique em Start Lab no AWS Academy e rode o workflow de novo."
              exit 1
            fi
          done

      - name: Atualizar o servidor de dados (configuração de observabilidade)
        run: |
          ssh "$DADOS" bash -se <<'REMOTO'
          set -euo pipefail
          cd /opt/helpdesk
          git fetch --quiet origin main && git reset --hard --quiet origin/main
          cd deploy/aws/dados
          docker compose up -d --remove-orphans
          docker compose ps --format 'table {{.Service}}\t{{.Status}}'
          REMOTO

      - name: Atualizar app-a (app-b segue atendendo)
        run: ssh "$APP_A" bash -s < .github/scripts/atualizar-app.sh

      - name: Atualizar app-b (app-a segue atendendo)
        if: env.APP_B != ''
        run: ssh "$APP_B" bash -s < .github/scripts/atualizar-app.sh

      - name: Verificar a aplicação pelo load balancer
        run: |
          for tentativa in $(seq 1 24); do
            web=$(curl -s -o /dev/null -w '%{http_code}' "http://$ALB/" || echo 000)
            api=$(curl -s -o /dev/null -w '%{http_code}' "http://$ALB/api/tickets" || echo 000)
            # A API responde 401 sem login: prova que o ALB chegou ao nginx e o nginx ao microsserviço.
            if [ "$web" = "200" ] && [ "$api" = "401" ]; then
              {
                echo "### 🚀 HelpDesk Cloud atualizado na AWS (deploy gradual)"
                echo "- Aplicação (load balancer): http://$ALB"
                echo "- Grafana: http://$DADOS:3000"
                echo "- Servidores de aplicação atualizados um de cada vez: app-a${APP_B:+, depois app-b}"
                echo "- Commit: \`${GITHUB_SHA::7}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "✅ Aplicação respondendo em http://$ALB"
              exit 0
            fi
            echo "Tentativa $tentativa/24: página HTTP $web, API HTTP $api; aguardando 10 s…"
            sleep 10
          done
          echo "::error::A aplicação não respondeu pelo load balancer em 4 minutos."
          exit 1

# CI/CD do HelpDesk Cloud: testa os microsserviços, gera o build do frontend e,
# se tudo passar, atualiza o servidor na AWS (EC2 criado pelo Terraform em infra/aws).
# O servidor só está ligado com o AWS Academy Learner Lab ativo (Start Lab).
name: CI/CD — HelpDesk Cloud na AWS

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  testes:
    name: 🧪 Testes e build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servico: [ticket-service, notification-service, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/${{ matrix.servico }}/package-lock.json
      - run: npm ci
        working-directory: app/${{ matrix.servico }}
      - name: Testes automatizados
        if: matrix.servico != 'frontend'
        run: npm test
        working-directory: app/${{ matrix.servico }}
      - name: Build de produção
        if: matrix.servico == 'frontend'
        run: npm run build
        working-directory: app/${{ matrix.servico }}

  imagens:
    name: 🐳 Build das imagens Docker
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v6
      - name: Construir as imagens do Docker Compose
        run: docker compose build

  deploy:
    name: 🚀 Deploy na AWS (EC2)
    runs-on: ubuntu-latest
    needs: imagens
    if: github.event_name != 'pull_request'
    environment: aws-academy
    steps:
      - name: Conferir os segredos
        env:
          HOST: ${{ secrets.AWS_EC2_HOST }}
          CHAVE: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$CHAVE" ]; then
            echo "::error::Cadastre os segredos AWS_EC2_HOST (IP do servidor) e AWS_EC2_SSH_KEY (conteúdo do labsuser.pem)."
            exit 1
          fi

      - name: Preparar a chave SSH
        env:
          CHAVE: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/aws.pem
          chmod 600 ~/.ssh/aws.pem

      - name: Atualizar o servidor (git pull + docker compose up)
        env:
          HOST: ${{ secrets.AWS_EC2_HOST }}
        run: |
          if ! ssh -i ~/.ssh/aws.pem -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "ec2-user@$HOST" true; then
            echo "::error::Não consegui conectar ao servidor $HOST. O laboratório está ligado? Clique em Start Lab no AWS Academy e rode o workflow de novo."
            exit 1
          fi
          ssh -i ~/.ssh/aws.pem "ec2-user@$HOST" bash -se <<'REMOTO'
          set -euo pipefail
          cd /opt/helpdesk
          git fetch --quiet origin main
          echo "Versão no servidor: $(git rev-parse --short HEAD) → nova: $(git rev-parse --short origin/main)"
          git reset --hard --quiet origin/main
          docker compose up -d --build --remove-orphans
          docker image prune -f > /dev/null
          docker compose ps --format 'table {{.Service}}\t{{.Status}}'
          REMOTO

      - name: Verificar a aplicação no ar
        env:
          HOST: ${{ secrets.AWS_EC2_HOST }}
        run: |
          for tentativa in $(seq 1 24); do
            web=$(curl -s -o /dev/null -w '%{http_code}' "http://$HOST/healthz" || echo 000)
            api=$(curl -s -o /dev/null -w '%{http_code}' "http://$HOST/api/tickets" || echo 000)
            # A API responde 401 sem login: isso prova que o nginx chegou ao microsserviço.
            if [ "$web" = "200" ] && { [ "$api" = "401" ] || [ "$api" = "200" ]; }; then
              {
                echo "### 🚀 HelpDesk Cloud atualizado na AWS"
                echo "- Aplicação: http://$HOST"
                echo "- Grafana: http://$HOST:3000"
                echo "- Commit: \`${GITHUB_SHA::7}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "✅ Aplicação respondendo em http://$HOST"
              exit 0
            fi
            echo "Tentativa $tentativa/24: frontend HTTP $web, API HTTP $api; aguardando 10 s…"
            sleep 10
          done
          echo "::error::A aplicação não respondeu em 4 minutos."
          exit 1

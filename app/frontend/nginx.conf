# O nginx serve o frontend e atua como gateway de API para os microsserviços.
# Com "resolver" + variável, o DNS é resolvido a cada requisição: o nginx sobe mesmo
# que um serviço esteja fora e acompanha a troca de réplicas.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver ${DNS_RESOLVER} valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/tickets {
        set $upstream http://${TICKET_SERVICE_HOST}:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/notifications {
        set $upstream http://${NOTIFICATION_SERVICE_HOST}:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}

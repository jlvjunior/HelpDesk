# kubectl apply -k infra/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - ticket-service.yaml
  - notification-service.yaml
  - frontend.yaml
  - monitoring.yaml
  - alerts.yaml

# Dashboard carregado automaticamente pelo sidecar do Grafana (label grafana_dashboard).
configMapGenerator:
  - name: helpdesk-dashboard
    namespace: monitoring
    files:
      - helpdesk.json=dashboard-helpdesk.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

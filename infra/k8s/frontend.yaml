apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: helpdesk
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080 # mapeado para localhost:8080 pelo kind (ver infra/terraform)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: helpdesk
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
      containers:
        - name: frontend
          image: helpdesk/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # O resolver do nginx não usa os search domains do pod: usar nomes completos.
            - name: DNS_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
            - name: TICKET_SERVICE_HOST
              value: ticket-service.helpdesk.svc.cluster.local
            - name: NOTIFICATION_SERVICE_HOST
              value: notification-service.helpdesk.svc.cluster.local
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: helpdesk
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend

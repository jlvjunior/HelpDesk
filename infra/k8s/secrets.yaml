# Credenciais de demonstração. Em produção, usar um cofre (External Secrets, Sealed Secrets, Vault)
# e nunca versionar segredos reais no Git.
apiVersion: v1
kind: Secret
metadata:
  name: helpdesk-secrets
  namespace: helpdesk
type: Opaque
stringData:
  POSTGRES_USER: helpdesk
  POSTGRES_PASSWORD: helpdesk
  POSTGRES_DB: helpdesk
  RABBITMQ_DEFAULT_USER: helpdesk
  RABBITMQ_DEFAULT_PASS: helpdesk
  DATABASE_URL: postgres://helpdesk:helpdesk@postgres:5432/helpdesk
  AMQP_URL: amqp://helpdesk:helpdesk@rabbitmq:5672

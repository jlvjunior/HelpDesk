global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # dns_sd descobre todas as réplicas de cada serviço pelo DNS do Docker.
  - job_name: ticket-service
    dns_sd_configs:
      - names: [ticket-service]
        type: A
        port: 3000

  - job_name: notification-service
    dns_sd_configs:
      - names: [notification-service]
        type: A
        port: 3000

  # Plugin rabbitmq_prometheus (já habilitado na imagem oficial).
  # /metrics/per-object traz as métricas por fila (label "queue").
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
